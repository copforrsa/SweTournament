name: Build WWW package

on:
  push:
    branches: [ main, work/v43.65-match-reports ]
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: swe-www-v43.73

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.cjs

      - name: Install browser test runner
        run: |
          npm install --prefix /tmp/swe-browser-tests --no-save --package-lock=false playwright@1.62.1
          /tmp/swe-browser-tests/node_modules/.bin/playwright install --with-deps chromium

      - name: Check registration, history, reports and live match
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/swe-browser-tests/node_modules
        run: |
          node tests/browser-smoke.cjs
          node tests/registration-preview.cjs

      - name: Prepare www directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          rsync -a ./ www/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'supabase/' \
            --exclude 'tests/' \
            --exclude 'www/' \
            --exclude 'README*' \
            --exclude '*.md' \
            --exclude '*.sql'
          printf 'SWÉ Tournament WWW package\nBuild source: %s\nCommit: %s\n' "${PACKAGE_NAME}" "${GITHUB_SHA}" > www/DEPLOY_INFO.txt
          zip -r "${PACKAGE_NAME}.zip" www >/dev/null

      - name: Upload WWW zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload visual checks
        uses: actions/upload-artifact@v4
        with:
          name: swe-visual-checks-v43.73
          path: tests/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
