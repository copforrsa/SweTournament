name: SWÉ r55 frontend browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/generated/**'
      - 'organizer-*.js'
      - 'player-home.js'
      - 'tests/browser-smoke.cjs'
      - '.github/workflows/frontend-smoke-r550.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate r55 module bundles
        run: |
          node scripts/build-front-bundles.cjs --check
          node --check app.js
          node --check assets/generated/swe-preapp-r550.js
          node --check assets/generated/swe-runtime-r550-part1.js
          node --check assets/generated/swe-runtime-r550-part2.js
          node --check assets/generated/swe-runtime-r550-part3.js
          node --test tests/manager-home-r550.test.cjs tests/organizer-home-private-panels.test.cjs
      - name: Install browser runner
        run: |
          npm ci --prefix tests --ignore-scripts
          npm install --prefix /tmp/swe-browser-tests --no-save --package-lock=false playwright@1.62.1
          /tmp/swe-browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser smoke (all three roles, mocked server, no production writes)
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: /tmp/swe-browser-tests/node_modules
        run: |
          node tests/coorganizer-dashboard-preview.cjs
          node tests/registration-preview.cjs
          node tests/browser-smoke.cjs
