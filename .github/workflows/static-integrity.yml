name: Static integrity check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check referenced assets and JavaScript syntax
        run: python scripts/verify_static_integrity.py
      - name: Test Service Worker offline and upgrade contract
        run: node --test tests/service-worker.test.cjs
