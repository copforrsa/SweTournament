name: Apply SWÉ V42.44
on:
  workflow_dispatch:
  push:
    paths:
      - 'hotfix-v4244.js'
      - 'season-hotfix-v4244.js'
      - '.github/workflows/apply-v4244.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42.44
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'V42\.\d+', 'V42.44', s)
          s=re.sub(r'MAJ 42\.\d+', 'MAJ 42.44', s)
          if 'hotfix-v4244.js' not in s:
              s=s.replace('</body></html>','<script src="./hotfix-v4244.js?v=4244" defer></script></body></html>')
          p.write_text(s)

          p=Path('season.html'); s=p.read_text()
          s=s.replace('./season.js?v=4245','./season.js?v=4245')
          if 'season-hotfix-v4244.js' not in s:
              s=s.replace('</body>','  <script src="./season-hotfix-v4244.js?v=4244" defer></script>\n</body>')
          p.write_text(s)

          p=Path('sw.js'); s=p.read_text()
          s=re.sub(r"const CACHE='swe-tournament-5v5-v42-\d+'", "const CACHE='swe-tournament-5v5-v42-44'", s)
          if "'./hotfix-v4244.js'" not in s:
              s=s.replace("'./hotfix-v4239.js'", "'./hotfix-v4239.js','./hotfix-v4244.js','./season-hotfix-v4244.js'")
          p.write_text(s)
          PY
          node --check hotfix-v4244.js
          node --check season-hotfix-v4244.js
          grep -q 'V42.44' index.html
          grep -q 'hotfix-v4244.js?v=4244' index.html
          grep -q 'season-hotfix-v4244.js?v=4244' season.html
          grep -q 'swe-tournament-5v5-v42-44' sw.js
      - name: Commit
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html season.html sw.js
          git diff --cached --quiet || git commit -m "Deploy V42.44 player membership fixes"
          git push
