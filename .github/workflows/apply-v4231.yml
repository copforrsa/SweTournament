name: Apply SWÉ V42.31
on:
  push:
    paths:
      - 'trigger-v4231.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42.31
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          # index + stable version
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'V42\.\d+','V42.31',s)
          s=re.sub(r'MAJ 42\.\d+','MAJ 42.31',s)
          s=re.sub(r'styles\.css\?v=\d+','styles.css?v=4231',s)
          s=re.sub(r'app\.js\?v=\d+','app.js?v=4231',s)
          tag='<script src="./hotfix-v4231.js?v=4231" defer></script>'
          if tag not in s:s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          # old hotfixes must not fight the visible version
          for fn in ['hotfix-v4229.js','hotfix-v4230.js']:
            p=Path(fn)
            if p.exists():
              s=p.read_text();s=re.sub(r"const VERSION='42\.\d+';","const VERSION='42.31';",s);p.write_text(s)
          # live page + live rules
          p=Path('live.html'); s=p.read_text();s=s.replace('live.js?v=4229','live.js?v=4231');p.write_text(s)
          p=Path('live.js'); s=p.read_text()
          s=s.replace("<div class=\"live-team-head\" style=\"background:'+bg+';color:'+teamFg(bg)+'\">👕 '+esc(t.name)+'", "<div class=\"live-team-head\" style=\"background:'+bg+';color:'+teamFg(bg)+'\">'+esc(t.name)+'")
          old="const bg=teamColor(t),members=teamPlayers.filter(tp=>String(tp.team_id)===String(t.id)).map(tp=>players.get(String(tp.player_id))).filter(Boolean),guests=members.filter(p=>p.is_group_member===false).length,note=teamNote(t);return '<article"
          new="const bg=teamColor(t),members=teamPlayers.filter(tp=>String(tp.team_id)===String(t.id)).map(tp=>players.get(String(tp.player_id))).filter(Boolean),guests=members.filter(p=>p.is_group_member===false).length,note=guests>2?null:teamNote(t);return '<article"
          s=s.replace(old,new)
          s=s.replace("+(note?'<div class=\"live-note\">🐶⚽ <b>Note équipe évaluée par Chien Boul Academy : '+note.toFixed(1)+'/5</b>'", "+(guests>2?'<div class=\"live-note\">🐶⚽ <b>Note équipe évaluée par Chien Boul Academy : ??</b> • Trop de Guests pour une note fiable</div>':(note?'<div class=\"live-note\">🐶⚽ <b>Note équipe évaluée par Chien Boul Academy : '+note.toFixed(1)+'/5</b>'")
          s=s.replace("+(t.mention?' • '+esc(t.mention):'')+'</div>':'')", "+(t.mention?' • '+esc(t.mention):'')+'</div>':''))")
          p.write_text(s)
          # service worker cache
          p=Path('sw.js'); s=p.read_text()
          s=re.sub(r"const CACHE='swe-tournament-5v5-v42-[^']+';","const CACHE='swe-tournament-5v5-v42-31';",s)
          if "'./hotfix-v4231.js'" not in s:s=s.replace('const STATIC_ASSETS=[','const STATIC_ASSETS=[\'./hotfix-v4231.js\',')
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check hotfix-v4229.js
          node --check hotfix-v4230.js
          node --check hotfix-v4231.js
          node --check live.js
      - name: Commit V42.31
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js live.html live.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.31 — alignement équipes, matchs et indisponibilités"
          git push
