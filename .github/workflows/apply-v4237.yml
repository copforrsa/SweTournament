name: Apply SWÉ V42.37
on:
  push:
    paths:
      - 'trigger-v4237.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer V42.37
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'V42\.\d+','V42.37',s)
          s=re.sub(r'MAJ 42\.\d+','MAJ 42.37',s)
          s=re.sub(r'styles\.css\?v=\d+','styles.css?v=4237',s)
          s=re.sub(r'app\.js\?v=\d+','app.js?v=4237',s)
          for n in ['4227','4228','4229','4230','4231','4232','4235','4236']:
              s=re.sub(fr'hotfix-v{n}\.js\?v=\d+',f'hotfix-v{n}.js?v=4237',s)
          s=re.sub(r'ui-stability-v4234\.js\?v=\d+','ui-stability-v4234.js?v=4237',s)
          if 'hotfix-v4237.js' not in s:
              s=s.replace('</body>','<script src="./hotfix-v4237.js?v=4237" defer></script></body>')
          p.write_text(s)
          for name in ['hotfix-v4227.js','hotfix-v4228.js','hotfix-v4229.js','hotfix-v4230.js','hotfix-v4231.js','hotfix-v4232.js','hotfix-v4235.js','hotfix-v4236.js','ui-stability-v4234.js']:
              q=Path(name)
              if q.exists():
                  x=q.read_text(); x=re.sub(r"const VERSION='42\.\d+'","const VERSION='42.37'",x); q.write_text(x)
          sw=Path('sw.js').read_text()
          sw=re.sub(r"const CACHE='[^']+';","const CACHE='swe-tournament-5v5-v42-37';",sw,1)
          if "'./hotfix-v4237.js'" not in sw:
              sw=sw.replace("'./hotfix-v4236.js'","'./hotfix-v4236.js','./hotfix-v4237.js'") if "'./hotfix-v4236.js'" in sw else sw.replace("'./ui-stability-v4234.js'","'./ui-stability-v4234.js','./hotfix-v4237.js'")
          Path('sw.js').write_text(sw)
          PY
      - name: Vérifier JavaScript
        run: |
          node --check app.js
          node --check hotfix-v4237.js
          node --check sw.js
      - name: Commit V42.37
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js hotfix-v4235.js hotfix-v4236.js ui-stability-v4234.js hotfix-v4237.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.37 — matchs lisibles et rematch rapide"
          git push
