name: Apply SWÉ V42.28
on:
  push:
    paths:
      - trigger-v4228.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<title>SWÉ TOURNAMENT 5/5 • V42\.\d+</title>','<title>SWÉ TOURNAMENT 5/5 • V42.28</title>',s)
          s=re.sub(r'V42\.\d+</span>', 'V42.28</span>', s)
          s=re.sub(r'MAJ 42\.\d+', 'MAJ 42.28', s)
          s=re.sub(r'styles\.css\?v=\d+', 'styles.css?v=4228', s)
          s=re.sub(r'app\.js\?v=\d+', 'app.js?v=4228', s)
          if 'hotfix-v4228.js' not in s:
              s=s.replace('<footer id="platformFooter"','<script src="./hotfix-v4228.js?v=4228" defer></script>\n<footer id="platformFooter"')
          if 'hotfix-v4228-live.js' not in s:
              s=s.replace('<footer id="platformFooter"','<script src="./hotfix-v4228-live.js?v=4228b" defer></script>\n<footer id="platformFooter"')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'SWÉ Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'V42.28 — suivi live public exact' || exit 0
          git push
