name: Apply SWÉ V42.27

on:
  push:
    paths:
      - 'trigger-v4227.txt'
      - '.github/workflows/apply-v4227.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index and service worker
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('SWÉ TOURNAMENT 5/5 • V42.8','SWÉ TOURNAMENT 5/5 • V42.27')
          s=s.replace('V42.23','V42.27').replace('MAJ 42.23','MAJ 42.27')
          s=s.replace('./styles.css?v=4223','./styles.css?v=4227')
          s=s.replace('./app.js?v=4223','./app.js?v=4227')
          marker='<script src="./app.js?v=4227" defer></script>'
          extra='\n<script src="./hotfix-v4227.js?v=4227" defer></script>'
          if 'hotfix-v4227.js' not in s:
              s=s.replace(marker,marker+extra)
          p.write_text(s)
          p=Path('sw.js')
          s=p.read_text()
          import re
          s=re.sub(r"const CACHE='[^']+';","const CACHE='swe-tournament-5v5-v42-27';",s,count=1)
          if "'./hotfix-v4227.js'" not in s:
              s=s.replace("'./app.js'","'./app.js','./hotfix-v4227.js'")
          p.write_text(s)
      - name: Commit V42.27
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js hotfix-v4227.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.27 — équipes publiques, inactifs et mode terrain offline"
          git push
