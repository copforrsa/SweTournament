name: Apply SWÉ V42.29
on:
  push:
    paths:
      - 'trigger-v4229.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public routing and live mode
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="regTour=openTours.find(t=>t.id===requestedTournament&&modeMatches(t))||null;"
          new="regTour=tournaments.find(t=>t.id===requestedTournament&&modeMatches(t))||null;"
          if old in s:
              s=s.replace(old,new)
          s=s.replace('Chien Boul Academy :','Note équipe évaluée par Chien Boul Academy :')
          p.write_text(s)

          p=Path('hotfix-v4228.js')
          s=p.read_text()
          needle='function activatePublicLive(){const pv='
          if needle in s:
              s=s.replace(needle,'function activatePublicLive(){return;const pv=',1)
          s=s.replace('Chien Boul Academy :','Note équipe évaluée par Chien Boul Academy :')
          p.write_text(s)

          p=Path('hotfix-v4228-live.js')
          s=p.read_text()
          needle='async function sync(){if(busy)return;'
          if needle in s:
              s=s.replace(needle,'async function sync(){return;if(busy)return;',1)
          s=s.replace('Chien Boul Academy :','Note équipe évaluée par Chien Boul Academy :')
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('V42.28','V42.29').replace('MAJ 42.28','MAJ 42.29')
          s=s.replace('./styles.css?v=4228','./styles.css?v=4229').replace('./app.js?v=4228','./app.js?v=4229')
          s=s.replace('<script src="./hotfix-v4228-live.js?v=4228b" defer></script>','')
          tag='<script src="./hotfix-v4229.js?v=4229" defer></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s)

          p=Path('sw.js')
          s=p.read_text()
          import re
          s=re.sub(r"const CACHE='swe-tournament-5v5-v42-[^']+';","const CACHE='swe-tournament-5v5-v42-29';",s)
          if "'./hotfix-v4229.js'" not in s:
              s=s.replace("const STATIC_ASSETS=[", "const STATIC_ASSETS=['./live.html','./live.js','./hotfix-v4229.js',")
          # live.html must never receive app hotfix injection
          nav="if(req.mode==='navigate'){"
          bypass="if(req.mode==='navigate'){\n    if(url.pathname.endsWith('/live.html')){event.respondWith(fetch(req,{cache:'no-store'}).catch(()=>caches.match('./live.html')));return;}"
          if bypass not in s:
              s=s.replace(nav,bypass,1)
          p.write_text(s)
          PY
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check hotfix-v4228.js
          node --check hotfix-v4228-live.js
          node --check hotfix-v4229.js
          node --check live.js
      - name: Commit V42.29
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html sw.js hotfix-v4228.js hotfix-v4228-live.js hotfix-v4229.js live.html live.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.29 — séparer inscription et suivi Live"
          git push
