name: Apply SWÉ V42.38
on:
  push:
    paths:
      - 'trigger-v4238.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42.38
        run: python scripts/apply_v4238.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js
          for f in hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js hotfix-v4235.js hotfix-v4236.js hotfix-v4237.js ui-stability-v4234.js; do [ -f "$f" ] && node --check "$f"; done
      - name: Commit V42.38
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js styles.css sw.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.38 — composition match compacte et onglets mobile"
          git push
