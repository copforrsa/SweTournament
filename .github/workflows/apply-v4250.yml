name: Apply SWÉ V42.50 — déploiement unique
on:
  push:
    paths:
      - '.github/workflows/apply-v4250.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolider la V42.50
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BUILD='42.50'
          CACHE='4250'

          # 1) Une seule version visible et un seul cache-buster dans la page racine.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'V42\.\d+', 'V'+BUILD, s)
          s=re.sub(r'MAJ 42\.\d+', 'MAJ '+BUILD, s)
          s=re.sub(r'(styles\.css|app\.js|ui-stability-v4234\.js|hotfix-v\d+\.js)\?v=\d+', lambda m:m.group(1)+'?v='+CACHE, s)
          # Les modules récents sont chargés explicitement, après les anciens modules.
          for name in ['hotfix-v4246.js','hotfix-v4248.js','hotfix-v4250.js']:
              tag=f'<script src="./{name}?v={CACHE}" defer></script>'
              if name not in s:
                  s=s.replace('</body></html>', tag+'</body></html>')
              else:
                  s=re.sub(fr'<script src="\./{re.escape(name)}\?v=\d+" defer></script>', tag, s)
          p.write_text(s,encoding='utf-8')

          # 2) Les anciens hotfixs gardent leurs fonctionnalités mais n'ont plus le droit
          #    d'annoncer une version antérieure. Tous les littéraux de build sont alignés.
          candidates=list(Path('.').glob('hotfix-v*.js'))+[Path('ui-stability-v4234.js')]
          for q in candidates:
              if not q.exists():
                  continue
              x=q.read_text(encoding='utf-8')
              x=re.sub(r"const VERSION='42\.\d+'", "const VERSION=(window.SWE_BUILD_VERSION||'42.50')", x)
              x=re.sub(r"const BUILD='42\.\d+'", "const BUILD=(window.SWE_BUILD_VERSION||'42.50')", x)
              # Neutralise aussi les rares écritures directes laissées dans les anciens correctifs.
              x=re.sub(r"'V42\.\d+'", "'V42.50'", x)
              x=re.sub(r"'MAJ 42\.\d+'", "'MAJ 42.50'", x)
              q.write_text(x,encoding='utf-8')

          # 3) Service worker minimal : réseau frais, aucun cache applicatif, aucune navigation forcée.
          Path('sw.js').write_text("""const SW_BUILD='42.50';
self.addEventListener('install',event=>{self.skipWaiting();});
self.addEventListener('activate',event=>{event.waitUntil((async()=>{const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('tournoi-foot-')||k.startsWith('swe-tournament-5v5-')).map(k=>caches.delete(k)));await self.clients.claim();})());});
self.addEventListener('fetch',event=>{const req=event.request;if(req.method!=='GET')return;const url=new URL(req.url);if(url.origin!==self.location.origin)return;if(req.mode==='navigate'||/\\.(?:html|js|css)$/i.test(url.pathname)||url.pathname.endsWith('/sw.js'))event.respondWith(fetch(req,{cache:'no-store'}));});
""",encoding='utf-8')

          # 4) Les anciens workflows de version sont la cause des retours 42.29...42.44.
          #    On les supprime : V42.50 devient l'unique mécanisme de consolidation.
          wf=Path('.github/workflows')
          for old in wf.glob('apply-v42*.yml'):
              if old.name!='apply-v4250.yml':
                  old.unlink()
          PY
      - name: Vérifier la consolidation
        run: |
          grep -q 'V42.50' index.html
          grep -q 'hotfix-v4248.js?v=4250' index.html
          grep -q 'hotfix-v4250.js?v=4250' index.html
          node --check sw.js
          node --check hotfix-v4248.js
          node --check hotfix-v4250.js
          ! grep -R "const VERSION='42\." hotfix-v*.js ui-stability-v4234.js
      - name: Commit V42.50 consolidée
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "V42.50 — consolider build et supprimer les rollbacks legacy"
          git push
