name: Apply SWÉ V42.35
on:
  push:
    paths:
      - 'trigger-v4235.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42.35
        run: python scripts/apply_v4235.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check hotfix-v4235.js
          node --check ui-stability-v4234.js
          node --check sw.js
          for f in hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js; do node --check "$f"; done
      - name: Commit V42.35
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js sw.js hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js ui-stability-v4234.js hotfix-v4235.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.35 — fiabilité joueurs et module SWÉ Pro"
          git push
