name: Apply SWÉ V42.34
on:
  push:
    paths:
      - 'trigger-v4234.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stability patch
        run: python scripts/apply_v4234.py
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check live.js
          node --check sw.js
          node --check ui-stability-v4234.js
          for f in hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js; do node --check "$f"; done
      - name: Commit V42.34
        run: |
          git config user.name "SWÉ Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js hotfix-v4227.js hotfix-v4228.js hotfix-v4229.js hotfix-v4230.js hotfix-v4231.js hotfix-v4232.js ui-stability-v4234.js
          git diff --cached --quiet && exit 0
          git commit -m "V42.34 — stabilité UI et chargement profil"
          git push
