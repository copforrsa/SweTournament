<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071b12">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'">
  <title>SWÉ LIVE • Tournoi en direct</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=4311">
  <link rel="shortcut icon" type="image/png" href="/favicon.png?v=4311">
  <link rel="apple-touch-icon" href="/icon-192.png?v=4311">
  <link rel="stylesheet" href="./styles.css?v=4311">
  <style>
    body{background:#f4f8ff}.live-shell{max-width:980px;margin:0 auto;padding:14px}.live-hero{background:linear-gradient(135deg,#071b12,#123f2b);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 12px 28px rgba(7,27,18,.18)}.live-hero h1{margin:0 0 5px;font-size:1.45rem}.live-meta{opacity:.86;font-size:.9rem}.live-status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:800;font-size:.78rem}.live-dot{width:9px;height:9px;border-radius:50%;background:#4ade80}.live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.live-team{background:#fff;border:1px solid #dbe7f5;border-radius:16px;overflow:hidden}.live-team-head{padding:12px 14px;font-weight:900}.live-team-body{padding:12px 14px}.live-note{padding:9px 11px;border-radius:12px;background:#fff7d7;border:1px solid #ead28b;font-size:.88rem;margin-bottom:9px}.live-player{padding:6px 0;border-top:1px solid #edf2f7}.live-player:first-child{border-top:0}.live-match{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:13px 0;border-top:1px solid #edf2f7}.live-match:first-child{border-top:0}.live-score{font-size:1.65rem;font-weight:950;white-space:nowrap;line-height:1}.live-match-events{margin-top:7px;display:grid;gap:4px}.live-match-event{font-size:.8rem;color:#475569}.live-match-event b{color:#0f172a}.live-table{width:100%;border-collapse:collapse}.live-table th,.live-table td{padding:8px 6px;border-bottom:1px solid #edf2f7;text-align:center;font-size:.82rem}.live-table th:nth-child(2),.live-table td:nth-child(2){text-align:left}.live-statbox{border:1px solid #dbe7f5;border-radius:14px;padding:12px}.live-statbox h3{margin:0 0 8px}.live-subs summary{cursor:pointer;font-weight:900}.live-error{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;padding:14px;border-radius:14px}.guest-tag{display:inline-block;padding:2px 6px;border-radius:999px;background:#fff2cc;font-size:.7rem;font-weight:800;margin-left:5px}@media(max-width:700px){.live-shell{padding:8px}.live-grid{grid-template-columns:1fr}.live-hero{border-radius:15px}.live-table{font-size:.76rem}.live-table th,.live-table td{padding:7px 3px}.live-match{grid-template-columns:minmax(0,1fr) auto}.live-score{font-size:1.45rem}}
  </style>
</head>
<body>
  <main class="live-shell">
    <section class="live-hero">
      <h1>⚽ SWÉ LIVE</h1>
      <div id="liveTitle" class="live-meta">Chargement du tournoi…</div>
      <div class="live-status"><span class="live-dot"></span><span id="liveStatus">Connexion au terrain…</span></div>
    </section>
    <div id="liveError" class="live-error hidden"></div>
    <section class="card live-primary"><div class="row" style="justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 class="sectiontitle">⚽ Matchs & résultats</h2><span id="liveUpdated" class="muted"></span></div><div id="liveMatches"></div></section>
    <section class="card"><h2 class="sectiontitle">📊 Classement en direct</h2><div id="liveRanking"></div></section>
    <section class="card"><h2 class="sectiontitle">🏅 Classements individuels</h2><div class="live-grid"><div class="live-statbox"><h3>⚽ Buteurs</h3><div id="liveScorers"></div></div><div class="live-statbox"><h3>🎯 Passeurs</h3><div id="liveAssists"></div></div></div></section>
    <section class="card"><h2 class="sectiontitle">👥 Équipes</h2><div id="liveTeams" class="live-grid"></div><div id="liveSubs"></div></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="./live.js?v=4311" defer></script>
</body>
</html>
