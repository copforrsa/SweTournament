<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d3d"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co https://api.qrserver.com; connect-src https://*.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"><title>Carte joueur SWÉ</title><link rel="icon" type="image/png" href="./favicon.png"><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 20% 10%,#eaf8ff,#f7fbff 45%,#edf3f8);color:#0b2b54;min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{width:min(760px,100%)}.brand{text-align:center;font-weight:950;letter-spacing:.05em;margin-bottom:14px}.card{position:relative;overflow:hidden;border-radius:30px;padding:24px;background:radial-gradient(circle at 18% 8%,#27c7df 0,#157aaa 24%,#0c3f78 58%,#071d3d 100%);color:#fff;border:3px solid #f2c84b;box-shadow:0 28px 80px rgba(7,29,61,.24)}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.stars{font-size:24px;color:#ffd24f}.photo{width:170px;height:190px;border-radius:24px;object-fit:cover;border:3px solid #fff;display:block;margin:18px auto 12px;background:#153d67}.name{text-align:center;font-size:34px;font-weight:950}.id{text-align:center;font-size:13px;font-weight:900;letter-spacing:.08em;color:#d9f8ff;margin-top:4px}.role{text-align:center;color:#ffda66;font-weight:900;margin:8px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:linear-gradient(145deg,rgba(31,131,211,.72),rgba(11,67,126,.86));border:1px solid rgba(135,211,255,.34);border-radius:16px;text-align:center;padding:14px 8px}.stat span{display:block;font-size:24px}.stat b{display:block;font-size:24px}.stat small{font-size:11px;color:#e3f4ff;font-weight:800}.share{margin-top:16px;background:#fff;border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.share h3{margin:0 0 5px}.share p{margin:0;color:#60748a;font-size:13px}.qr{width:110px;height:110px}.error{background:#fff;padding:22px;border-radius:18px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.08)}@media(max-width:640px){body{padding:14px}.card{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.share{grid-template-columns:1fr;text-align:center}.qr{margin:auto}.name{font-size:28px}}</style></head><body><div class="wrap"><div class="brand">👑 SWÉ TOURNAMENT 5/5</div><div id="root" class="error">Chargement de la carte…</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://fbppesfxkvledwjemwsn.supabase.co','sb_publishable_Kl3HDD4S08YC1EB-cWJKaQ_e9gCbygp');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const role=v=>({goalkeeper:'Gardien',defender:'Défenseur',midfielder:'Milieu',forward:'Attaquant',couteau_suisse:'Couteau suisse'}[String(v||'').toLowerCase()]||v||'Non défini');(async()=>{const token=new URL(location.href).searchParams.get('token'),root=document.getElementById('root');if(!token){root.textContent='Lien de carte invalide.';return}const {data,error}=await sb.rpc('get_public_player_card_by_token_v1',{p_token:token});if(error||!data){root.textContent='Cette carte n’est plus disponible.';return}const rating=Number(data.rating||0),stars=Math.max(0,Math.min(5,Math.round(rating))),stats=[['🎮','Matchs',data.matches],['✅','Victoires',data.wins],['🥅','Buts',data.goals],['🎯','Passes',data.assists],['🏆','Tournois remportés',data.tournament_wins],['⭐','Note SWÉ',data.rating==null?'—':Number(data.rating).toFixed(1)+'/5']],url=location.href.split('#')[0],qr='https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(url);root.className='';root.innerHTML='<div class="card"><div class="head"><b>CARTE JOUEUR SWÉ</b><div class="stars">'+('★'.repeat(stars)+'☆'.repeat(5-stars))+'</div></div>'+(data.avatar_url?'<img class="photo" src="'+esc(data.avatar_url)+'" alt="Photo joueur">':'<div class="photo" style="display:grid;place-items:center;font-weight:950">SWÉ</div>')+'<div class="name">'+esc(data.display_name||'Joueur SWÉ')+'</div><div class="id">'+esc(data.public_player_id)+' &nbsp; ID SWE</div><div class="role">'+esc(role(data.preferred_role))+'</div><div class="stats">'+stats.map(x=>'<div class="stat"><span>'+x[0]+'</span><b>'+esc(x[2]??0)+'</b><small>'+esc(x[1])+'</small></div>').join('')+'</div></div><div class="share"><div><h3>Partager cette carte</h3><p>Scanne le QR code pour ouvrir la carte joueur SWÉ.</p></div><img class="qr" src="'+qr+'" alt="QR code de partage"></div>';if(location.hash==='#qr')document.querySelector('.share')?.scrollIntoView({behavior:'smooth'})})();</script></body></html>
